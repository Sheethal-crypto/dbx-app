# Base theme. Anything not expressible here is done with targeted CSS in app.py.

[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FAF9F7"
secondaryBackgroundColor = "#F1EFEC"
textColor = "#16181A"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false
